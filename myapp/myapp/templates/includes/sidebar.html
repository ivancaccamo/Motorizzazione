<div class="sidebar">
    <h3 class="sidebar-title">Filtro Ricerca</h3>

    <form method="get">
        {% if current_filters %}
            <!-- Mostra pulsante per rimuovere i filtri se attivi -->
            <div style="margin-bottom: 1em;">
                <a href="?clear_filters=1" class="btn-cancel">Rimuovi Filtri</a>
            </div>
        {% endif %}

        {% if pagina_attiva == 'veicolo' %}
            <!-- Filtri per pagina Veicolo -->
            <div class="form-group">
                <label for="telaio">Telaio:</label>
                <input type="text" id="telaio" name="telaio" value="{{ current_filters.telaio|default:'' }}">
            </div>
            <div class="form-group">
                <label for="marca">Marca:</label>
                <input type="text" id="marca" name="marca" value="{{ current_filters.marca|default:'' }}">
            </div>
            <div class="form-group">
                <label for="modello">Modello:</label>
                <input type="text" id="modello" name="modello" value="{{ current_filters.modello|default:'' }}">
            </div>

        {% elif pagina_attiva == 'targa' %}
            <!-- Filtri per pagina Targa -->
            <div class="form-group">
                <label for="numero">Numero Targa:</label>
                <input type="text" id="numero" name="numero" value="{{ current_filters.numero|default:'' }}">
            </div>
            <div class="form-group">
                <label for="dataEm">Data Emissione:</label>
                <input type="date" id="dataEm" name="dataEm" value="{{ current_filters.dataEm|default:'' }}">
            </div>
            <div class="form-group">
                <label for="statoTarga">Stato Targa:</label>
                <select id="statoTarga" name="statoTarga">
                    <option value="">Tutti</option>
                    <option value="Attiva" {% if current_filters.statoTarga == "Attiva" %}selected{% endif %}>Attive</option>
                    <option value="Restituita" {% if current_filters.statoTarga == "Restituita" %}selected{% endif %}>Restituite</option>
                    <option value="Non Assegnata" {% if current_filters.statoTarga == "Non Assegnata" %}selected{% endif %}>Non Assegnate</option>
                </select>
            </div>

        {% elif pagina_attiva == 'revisione' %}
            <!-- Filtri per pagina Revisione -->
            <div class="form-group">
                <label for="id_revisione">ID Revisione:</label>
                <input type="text" id="id_revisione" name="id_revisione" value="{{ current_filters.id_revisione|default:'' }}">
            </div>
            <div class="form-group">
                <label for="dataRev">Data Revisione:</label>
                <input type="date" id="dataRev" name="dataRev" value="{{ current_filters.dataRev|default:'' }}">
            </div>
            <div class="form-group">
                <label for="stato">Stato:</label>
                <select id="stato" name="stato">
                    <option value="">Tutti</option>
                    <option value="superata" {% if current_filters.stato == "superata" %}selected{% endif %}>Superata</option>
                    <option value="non_superata" {% if current_filters.stato == "non_superata" %}selected{% endif %}>Non Superata</option>
                </select>
            </div>
        {% endif %}

        <!-- Pulsante invio form -->
        <button type="submit" class="btn-primary">Cerca</button>
    </form>
</div>
