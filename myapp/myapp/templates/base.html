{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorizzazione</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <!-- Intestazione sito -->
    <header>
        <div class="header-content">
            <h1 class="site-title">Motorizzazione</h1>
            <img 
                src="{% static 'logo/Progetto_senza_titolo__3_.png' %}" 
                alt="Logo Motorizzazione" 
                class="logo"
            >
        </div>
    </header>

    <!-- Menu di navigazione principale -->
    <nav>
        <ul>
            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="{% url 'gestione_veicoli' %}">Veicoli</a></li>
            <li><a href="{% url 'gestione_targhe' %}">Targhe</a></li>
            <li><a href="{% url 'gestione_revisioni' %}">Revisioni</a></li>
        </ul>
    </nav>

    <div class="container"> 
        {% if show_sidebar %}
            {% include 'includes/sidebar.html' %}
        {% endif %}

        <div class="content">
            {% block content %}
            <!-- Contenuto dinamico della pagina -->
            {% endblock %}
        </div>
    </div>

    <!-- Piè di pagina -->
    <footer>
        <p>&copy; {{ now|date:"Y" }} Sistema Gestionale Motorizzazione Civile</p>
    </footer>

    <!-- Script esterni e inizializzazione -->
    <script src="{% static 'function.js' %}" defer></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            hideMessageAfterDelay();
        });
    </script>
</body>
</html>
