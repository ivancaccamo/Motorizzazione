{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container">
    <div class="content">
        <div class="header-bar">
            <h2>Aggiungi Nuova Revisione</h2>
        </div>

        <form method="post" class="form-standard">
            {% csrf_token %}

            <div class="form-group">
                <label for="numero_targa">Targa:</label>
                <select name="numero_targa" id="numero_targa" required>
                    <option value="">Seleziona...</option>
                    {% for t in targhe %}
                        <option value="{{ t.numero }}">{{ t.numero }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="dataRev">Data Revisione:</label>
                <input type="date" name="dataRev" id="dataRev" required>
            </div>

            <div class="form-group">
                <label for="esito">Esito:</label>
                <select name="esito" id="esito" required onchange="toggleMotivazione(this)">
                    <option value="">Seleziona</option>
                    <option value="Superata">Superata</option>
                    <option value="Non superata">Non superata</option>
                </select>
            </div>

            <div id="motivazione" class="form-group" style="display: none;">
                <label for="motivazione_input">Motivazione:</label>
                <textarea name="motivazione" id="motivazione_input" rows="4"></textarea>
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn-primary">Salva</button>
                <a href="{% url 'gestione_revisioni' %}" class="btn-cancel">Annulla</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function toggleMotivazione(selectElement) {
        const motivazioneDiv = document.getElementById('motivazione');
        motivazioneDiv.style.display = selectElement.value === 'Non superata' ? 'block' : 'none';
    }

    document.addEventListener("DOMContentLoaded", function () {
        hideMessageAfterDelay();  // Se presente in function.js
    });
</script>
{% endblock %}
